<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - QA Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body class="login-body">
    <main class="login-panel">
        <h1>QA Shop Login</h1>
        {% if error %}<div class="alert error" data-testid="error-message">{{ error }}</div>{% endif %}
        <form method="post" data-testid="login-form">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" data-testid="email-input">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" data-testid="password-input">
            <button type="submit" data-testid="login-button">Login</button>
        </form>
    </main>
</body>
</html>
