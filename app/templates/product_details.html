{% extends "base.html" %}
{% block content %}
<section class="detail" data-testid="product-details">
    <h1 data-testid="product-name">{{ product.name }}</h1>
    <p>{{ product.description }}</p>
    <p>Category: {{ product.category }}</p>
    <p>Price: <strong data-testid="detail-price">${{ "%.2f"|format(product.price) }}</strong></p>
    <p>Available stock: <span data-testid="detail-stock">{{ product.stock_quantity }}</span></p>
    <form method="post" action="{{ url_for('ui_add_cart') }}">
        <input type="hidden" name="product_id" value="{{ product.product_id }}">
        <label for="quantity">Quantity</label>
        <input id="quantity" name="quantity" type="number" min="1" value="1" data-testid="quantity-input">
        <button type="submit" data-testid="add-to-cart-button">Add to cart</button>
    </form>
</section>
{% endblock %}
